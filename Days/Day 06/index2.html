<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(203, 194, 194);
            color: black;
            padding: 14px;
        }

        .logo{
            color: rgb(9, 169, 147);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            font-size: 30px;
        }

        .nav-link {
            /* one line  */
            display: flex;
            /* to remove the dot of ul  */
            list-style: none;
            /* for the gap  */
            gap: 20px;

        }

        .nav-link a{
            /* to remove line  */
             text-decoration: none;
             color: rgb(8, 164, 164);

        }
        /* Resposive  */
        @media(max-width:600px){
            .navbar{
                flex-direction:column;
                gap: 15px;

            }
            
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">BRANDLOGO</div>
        <ul class="nav-link">
            <li><a href="">HOME</a></li>
            <li><a href="">ABOUT</a></li>
            <li><a href="">CONTACT</a></li>
           <!-- hi--> 
        </ul>
    </nav>
</body>
</html>
