<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: brown;
            margin: 50px;
            border-radius: 10px;
            /* ease - slow and fast animation  */
            animation: moveBox 3s ease infinite;
            
        }
        @keyframes moveBox {
            from{
                /* X axis  */
                transform: translateX(150px);
            }
            to{
                transform: translateX(-150px);
            }
            
        }
        .ball{
            background-color: black;
            height: 100px;
            width: 100px;
            /* for ball shape */
            border-radius: 50px;
            animation: bounce 1s ease infinite; 
        
        }
/* keyword for animation  */
        @keyframes bounce {
            0%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-80px);
            }
            100%{
                transform: translateY(0);
            }
        }

       .spinner {
            width: 60px;
            height: 60px;
            border: 8px solid #e0e0e0;    
            border-top: 8px solid black;   
            border-radius: 50%;            
            margin-top: 70px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
        h1{
            animation: fadeInUp 3s ease infinite alternate;

        }

        @keyframes fadeInUp {
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="ball"></div>
    <div class="spinner"></div>
    <h1>HI! I Am John</h1>
</body>
</html>
